[functions]
  directory = "netlify/functions"

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.23.1"
  SECRETS_SCAN_ENABLED = "true"
  # Keep secret scanning enabled, but skip Turbopack's non-published build cache.
  # Public NEXT_PUBLIC_* client configuration must remain non-secret in Netlify.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
