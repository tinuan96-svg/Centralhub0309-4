name: CentralHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
  # Supabase publishable keys are intentionally public client configuration.
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_6IwwngtJYA8G9zrIy0q5vw_eaQXWO5k

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout event revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency high severity security gate
        # Production dependency gate. The Capacitor dev-only xcode package requires uuid ^7,
        # while CentralHub intentionally overrides uuid to 11.1.1; npm's retired quick-audit
        # endpoint rejects that dev tree as invalid even though npm ci reports zero vulnerabilities.
        run: npm audit --omit=dev --audit-level=high

      - name: Supabase client config gate
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"

      - name: Lint
        run: npm run lint

      - name: Route integrity audit
        run: npm run audit:routes

      - name: Feature continuity audit
        run: npm run audit:features

      - name: Runtime compatibility audit
        run: npm run audit:runtime

      - name: Order sync contract audit
        run: npm run audit:order-sync

      - name: Staff access foundation security regression tests
        run: npm run audit:staff

      - name: Inventory privileged integrations
        run: npm run audit:privileged

      - name: Publish security inventory for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4-privileged-integration-inventory
          path: artifacts/issue4-privileged-integration-inventory.json
          if-no-files-found: warn
          retention-days: 14

      - name: Public demo isolation and visual parity regression tests
        run: node --test scripts/public-demo-contract.test.cjs

      - name: Public homepage navigation, image and privacy regression tests
        run: node --test scripts/public-homepage-contract.test.cjs

      - name: Compact NORA outer-screen layout and secure login regression tests
        run: node --test scripts/nora-login-compact.test.cjs

      - name: Live dashboard motion and telemetry accuracy regression tests
        run: node --test scripts/dashboard-live-motion.test.cjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Post-build smoke audit
        run: npm run audit:smoke

      - name: Export verified source artifact
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[export-source]')
        uses: actions/upload-artifact@v7
        with:
          name: centralhub-main-source-${{ github.sha }}
          path: |
            .
            !node_modules/**
            !.next/**
            !.git/**
            !.env
            !.env.*
            !route-audit-output.txt
            !feature-continuity-audit-output.txt
          include-hidden-files: true
          retention-days: 1
