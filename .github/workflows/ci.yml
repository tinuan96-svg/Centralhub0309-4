name: CentralHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
  # Supabase publishable keys are intentionally public client configuration.
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_6IwwngtJYA8G9zrIy0q5vw_eaQXWO5k

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency high severity security gate
        run: npm audit --audit-level=high

      - name: Supabase client config gate
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"

      - name: Lint
        run: npm run lint

      - name: Route integrity audit
        run: npm run audit:routes

      - name: Feature continuity audit
        run: npm run audit:features

      - name: Runtime compatibility audit
        run: npm run audit:runtime

      - name: Order sync contract audit
        run: npm run audit:order-sync

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Post-build smoke audit
        run: npm run audit:smoke

      - name: Export verified source artifact
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[export-source]')
        uses: actions/upload-artifact@v4
        with:
          name: centralhub-main-source-${{ github.sha }}
          path: |
            .
            !node_modules/**
            !.next/**
            !.git/**
            !.env
            !.env.*
            !route-audit-output.txt
            !feature-continuity-audit-output.txt
          include-hidden-files: true
          retention-days: 1
