name: CentralHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Route integrity audit
        run: npm run audit:routes

      - name: Feature continuity audit
        run: npm run audit:features

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Post-build smoke audit
        run: npm run audit:smoke

      - name: Export verified source artifact
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[export-source]')
        uses: actions/upload-artifact@v4
        with:
          name: centralhub-main-source-${{ github.sha }}
          path: |
            .
            !node_modules/**
            !.next/**
            !.git/**
            !.env
            !.env.*
            !route-audit-output.txt
            !feature-continuity-audit-output.txt
          include-hidden-files: true
          retention-days: 1
