name: One-off Shruthi cloud voice fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shruthi-cloud-voice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Apply Shruthi cloud speech patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('components/CentralHubVoiceAssistant.tsx')
          s = p.read_text()

          marker = "type NativeBridge = {"
          speech_type = """type ShruthiSpeechReply = {\n  success?: boolean;\n  audioBase64?: string;\n  mimeType?: string;\n  voice?: string;\n  error?: string;\n};\n\n"""
          assert marker in s
          s = s.replace(marker, speech_type + marker, 1)

          invoke_marker = "\nfunction inferMode(pathname: string, text: string): AssistantMode {"
          invoke_speech = """
async function invokeShruthiSpeech(text: string): Promise<ShruthiSpeechReply> {
  const headers = await getVoiceAuthHeaders();
  const { data, error } = await supabase.functions.invoke('centralhub-shruthi-speech', {
    body: { text },
    headers,
  });
  if (error) throw new Error(error.message || 'Shruthi speech request failed.');
  return (data || {}) as ShruthiSpeechReply;
}
"""
          assert invoke_marker in s
          s = s.replace(invoke_marker, invoke_speech + invoke_marker, 1)

          ref_marker = "  const themeRef = useRef<NoraThemeId>('signature');"
          assert ref_marker in s
          s = s.replace(ref_marker, ref_marker + "\n  const cloudAudioRef = useRef<HTMLAudioElement | null>(null);\n  const cloudAudioUrlRef = useRef<string | null>(null);", 1)

          old_stop = """  const stopSpeech = useCallback(() => {
    if (speechVisualTimerRef.current) window.clearTimeout(speechVisualTimerRef.current);
    speechVisualTimerRef.current = null;
    setSpeaking(false);
    window.speechSynthesis?.cancel();
    const bridge = getNativeBridge();
    bridge?.stopTaraTts?.();
    bridge?.setTaraSpeaking?.(false);
  }, []);"""
          new_stop = """  const stopSpeech = useCallback(() => {
    if (speechVisualTimerRef.current) window.clearTimeout(speechVisualTimerRef.current);
    speechVisualTimerRef.current = null;
    const cloudAudio = cloudAudioRef.current;
    if (cloudAudio) {
      try { cloudAudio.pause(); } catch { }
      cloudAudio.src = '';
      cloudAudioRef.current = null;
    }
    if (cloudAudioUrlRef.current) {
      URL.revokeObjectURL(cloudAudioUrlRef.current);
      cloudAudioUrlRef.current = null;
    }
    setSpeaking(false);
    window.speechSynthesis?.cancel();
    const bridge = getNativeBridge();
    bridge?.stopTaraTts?.();
    bridge?.setTaraSpeaking?.(false);
  }, []);"""
          assert old_stop in s
          s = s.replace(old_stop, new_stop, 1)

          start = s.index("  const speak = useCallback((text: string) => {")
          end_token = "  }, [autoSpeak, stopSpeech]);"
          end = s.index(end_token, start) + len(end_token)
          new_speak = r'''  const speak = useCallback((text: string) => {
    if (!text || typeof window === 'undefined' || !autoSpeak) {
      stopSpeech();
      return;
    }

    const bridge = getNativeBridge();
    const hasMalayalam = /[\u0D00-\u0D7F]/.test(text);
    const language = hasMalayalam ? 'ml-IN' : 'en-GB';
    stopSpeech();
    setSpeaking(true);
    bridge?.setTaraSpeaking?.(true);

    const finish = () => {
      bridge?.setTaraSpeaking?.(false);
      if (speechVisualTimerRef.current) window.clearTimeout(speechVisualTimerRef.current);
      speechVisualTimerRef.current = null;
      setSpeaking(false);
    };

    if (speechVisualTimerRef.current) window.clearTimeout(speechVisualTimerRef.current);
    const estimatedMs = Math.min(30_000, Math.max(2200, text.length * 62));
    speechVisualTimerRef.current = window.setTimeout(finish, estimatedMs);

    const fallbackToLocalFemale = () => {
      if (bridge?.getPlatform?.() === 'android' && bridge?.speakTara) {
        window.speechSynthesis?.cancel();
        try {
          if (bridge.speakTara(text, language)) return;
        } catch {
          // Fall through to browser female voice only.
        }
      }

      if (!('speechSynthesis' in window)) {
        finish();
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = language;
      utterance.rate = 0.93;
      utterance.pitch = 1.04;
      utterance.volume = 1;
      const preferred = pickExecutiveVoice(window.speechSynthesis.getVoices(), language);
      if (!preferred) {
        finish();
        return;
      }
      utterance.voice = preferred;
      utterance.onend = finish;
      utterance.onerror = finish;
      window.speechSynthesis.speak(utterance);
    };

    void (async () => {
      try {
        const speech = await invokeShruthiSpeech(text);
        if (!speech.success || !speech.audioBase64) throw new Error(speech.error || 'No speech audio returned.');

        const binary = atob(speech.audioBase64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        const blob = new Blob([bytes], { type: speech.mimeType || 'audio/mpeg' });
        const url = URL.createObjectURL(blob);
        cloudAudioUrlRef.current = url;
        const audio = new Audio(url);
        cloudAudioRef.current = audio;
        audio.preload = 'auto';
        audio.onended = () => {
          if (cloudAudioRef.current === audio) cloudAudioRef.current = null;
          if (cloudAudioUrlRef.current === url) {
            URL.revokeObjectURL(url);
            cloudAudioUrlRef.current = null;
          }
          finish();
        };
        audio.onerror = () => {
          if (cloudAudioRef.current === audio) cloudAudioRef.current = null;
          if (cloudAudioUrlRef.current === url) {
            URL.revokeObjectURL(url);
            cloudAudioUrlRef.current = null;
          }
          fallbackToLocalFemale();
        };
        await audio.play();
      } catch {
        fallbackToLocalFemale();
      }
    })();
  }, [autoSpeak, stopSpeech]);'''
          s = s[:start] + new_speak + s[end:]
          p.write_text(s)

          p = Path('android/app/src/main/java/com/centralhub/network/MainActivity.java')
          s = p.read_text()
          old = '        webSettings.setUseWideViewPort(true);'
          new = '        webSettings.setUseWideViewPort(true);\n        // Shruthi cloud TTS is generated after an authenticated network round-trip.\n        // Allow the trusted CentralHub WebView to play that assistant audio without a second tap.\n        webSettings.setMediaPlaybackRequiresUserGesture(false);'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          trigger = Path('android/SHRUTHI_WAKE_RELEASE.txt')
          existing = trigger.read_text() if trigger.exists() else ''
          trigger.write_text(existing.rstrip() + '\nShruthi cloud speech playback enabled; build native release.\n')

      - name: Install dependencies
        run: npm ci

      - name: Dependency high severity security gate
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Runtime compatibility audit
        run: npm run audit:runtime

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Post-build smoke audit
        run: npm run audit:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Commit verified fix and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-shruthi-cloud-voice.yml
          git config user.name "centralhub-automation"
          git config user.email "centralhub-automation@users.noreply.github.com"
          git add components/CentralHubVoiceAssistant.tsx \
                  android/app/src/main/java/com/centralhub/network/MainActivity.java \
                  android/SHRUTHI_WAKE_RELEASE.txt \
                  .github/workflows/fix-shruthi-cloud-voice.yml
          git commit -m "fix: restore Shruthi speech with cloud TTS fallback"
          git push origin HEAD:main
