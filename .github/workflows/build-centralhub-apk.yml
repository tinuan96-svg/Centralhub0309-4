name: Build CentralHub Android APK
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.centralhub_build_id != '' && format('CentralHub Android • {0}', inputs.centralhub_build_id) || format('CentralHub Android • {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      centralhub_build_id:
        description: 'CentralHub CI build record ID'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-centralhub-apk.yml'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout CentralHub
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Direct APK upgrades only work when every APK is signed by the same key.
      # Keep the current identity unchanged until it has a durable encrypted backup.
      - name: Restore stable Android signing identity
        uses: actions/cache@v4
        with:
          path: ~/.centralhub/centralhub-update.keystore
          key: centralhub-android-signing-v2

      - name: Ensure stable Android signing identity
        id: signing
        shell: bash
        run: |
          mkdir -p "$HOME/.centralhub"
          KEYSTORE="$HOME/.centralhub/centralhub-update.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass centralhub \
              -keypass centralhub \
              -alias centralhub \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=CentralHub, OU=Internal Android Updates, O=CentralHub, C=GB"
          fi
          IDENTITY_SHA256=$(sha256sum "$KEYSTORE" | awk '{print $1}')
          EXPECTED_SHA256=$(tr -d '[:space:]' < .github/centralhub-android-signing.sha256)
          test -n "$IDENTITY_SHA256"
          test -n "$EXPECTED_SHA256"
          if [ "$IDENTITY_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "CentralHub Android signing identity mismatch. Refusing to publish an APK that cannot update the installed app." >&2
            echo "Expected: $EXPECTED_SHA256" >&2
            echo "Actual:   $IDENTITY_SHA256" >&2
            exit 1
          fi
          echo "fingerprint=$IDENTITY_SHA256" >> "$GITHUB_OUTPUT"
          echo "CENTRALHUB_SIGNING_STORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CENTRALHUB_SIGNING_STORE_PASSWORD=centralhub" >> "$GITHUB_ENV"
          echo "CENTRALHUB_SIGNING_KEY_ALIAS=centralhub" >> "$GITHUB_ENV"
          echo "CENTRALHUB_SIGNING_KEY_PASSWORD=centralhub" >> "$GITHUB_ENV"
          echo "CentralHub signing identity verified: $IDENTITY_SHA256"

      - name: Compute native app version
        id: version
        shell: bash
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.2.${GITHUB_RUN_NUMBER}"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "CENTRALHUB_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "CENTRALHUB_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare dashboard update package
        shell: bash
        run: |
          APK="centralhub-android-v${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          cat > centralhub-ci-manifest.json <<EOF
          {
            "centralhub_build_id": "${{ inputs.centralhub_build_id }}",
            "github_run_id": "${{ github.run_id }}",
            "github_run_number": "${{ github.run_number }}",
            "commit_sha": "${{ github.sha }}",
            "version_name": "${{ steps.version.outputs.name }}",
            "version_code": "${{ steps.version.outputs.code }}",
            "artifact_file": "$APK",
            "platform": "android"
          }
          EOF

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: centralhub-android-v${{ steps.version.outputs.name }}
          path: |
            centralhub-android-v${{ steps.version.outputs.name }}.apk
            centralhub-ci-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to the CentralHub update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="centralhub-android-v${{ steps.version.outputs.name }}-c${{ steps.version.outputs.code }}"
          APK="centralhub-android-v${{ steps.version.outputs.name }}.apk"
          NOTES=$(cat <<EOF
          CentralHub Android native shell update.

          Version: ${{ steps.version.outputs.name }}
          Version code: ${{ steps.version.outputs.code }}
          Commit: ${{ github.sha }}
          CentralHub CI build: ${{ inputs.centralhub_build_id }}
          Signing identity SHA-256: ${{ steps.signing.outputs.fingerprint }}

          Normal CentralHub website/dashboard/database/API changes arrive automatically and do not need a new APK. This package is published only when Android/native configuration changes require an installed-app update.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "CentralHub Android ${{ steps.version.outputs.name }}" \
              --notes "$NOTES"
          fi

# CentralHub's installed Android shell loads https://centralhub.network directly.
# Normal UI, dashboard, database and API changes therefore arrive automatically and do not need a new APK.
# This workflow is reserved for actual Android shell/config/dependency changes.
