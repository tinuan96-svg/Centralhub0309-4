name: Patch Shruthi native live conversation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-shruthi-native-live.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch native and web turn-taking
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          main_path = Path('android/app/src/main/java/com/centralhub/network/MainActivity.java')
          main = main_path.read_text()

          main = replace_once(main,
          '    private long taraSpeechEndedAt = 0L;\n    private String taraLastTranscriptText = "";',
          '    private long taraSpeechEndedAt = 0L;\n    private long taraLastRmsDispatchAt = 0L;\n    private final StringBuilder taraSegmentText = new StringBuilder();\n    private String taraLastTranscriptText = "";',
          'native fields')

          main = main.replace('RecognizerIntent.EXTRA_SPEECH_INPUT_MINIMUM_LENGTH_MILLIS, 450L', 'RecognizerIntent.EXTRA_SPEECH_INPUT_MINIMUM_LENGTH_MILLIS, 280L')
          main = main.replace('RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 650L', 'RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 480L')
          main = main.replace('RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 1050L', 'RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 720L')

          main = replace_once(main,
          '                taraReadyForSpeech = true;\n                taraListening = true;\n                taraConsecutiveErrors = 0;\n            }\n            @Override public void onBeginningOfSpeech() { }\n            @Override public void onRmsChanged(float rmsdB) { }\n            @Override public void onBufferReceived(byte[] buffer) { }\n            @Override public void onEndOfSpeech() { }',
          '                taraReadyForSpeech = true;\n                taraListening = true;\n                taraSegmentText.setLength(0);\n                taraConsecutiveErrors = 0;\n            }\n            @Override\n            public void onBeginningOfSpeech() {\n                if (noraConversationActive && !taraSpeaking) dispatchTaraUserSpeechStart();\n            }\n            @Override\n            public void onRmsChanged(float rmsdB) {\n                if (noraConversationActive && !taraSpeaking) dispatchTaraRms(rmsdB);\n            }\n            @Override public void onBufferReceived(byte[] buffer) { }\n            @Override public void onEndOfSpeech() { }',
          'native callbacks')

          old_results = '''            @Override
            public void onResults(Bundle results) {
                taraHandler.removeCallbacks(taraStartWatchdogRunnable);
                clearPendingPartialWake();
                processNoraRecognitionBundle(results);
                closeTaraAudioPipe();
                taraListening = false;
                taraReadyForSpeech = false;
                taraConsecutiveErrors = 0;
                scheduleTaraRestart(noraConversationActive ? 450L : (taraSegmentedSession ? 900L : 800L));
            }'''
          new_results = '''            @Override
            public void onResults(Bundle results) {
                taraHandler.removeCallbacks(taraStartWatchdogRunnable);
                clearPendingPartialWake();
                taraSegmentText.setLength(0);
                processNoraRecognitionBundle(results);
                closeTaraAudioPipe();
                taraListening = false;
                taraReadyForSpeech = false;
                taraConsecutiveErrors = 0;
                scheduleTaraRestart(noraConversationActive ? 180L : (taraSegmentedSession ? 700L : 650L));
            }'''
          main = replace_once(main, old_results, new_results, 'onResults')

          old_segment = '''            @Override
            public void onSegmentResults(Bundle segmentResults) {
                clearPendingPartialWake();
                processNoraRecognitionBundle(segmentResults);
                taraConsecutiveErrors = 0;
                taraListening = true;
            }

            @Override
            public void onEndOfSegmentedSession() {
                taraHandler.removeCallbacks(taraStartWatchdogRunnable);
                clearPendingPartialWake();
                closeTaraAudioPipe();
                taraListening = false;
                taraReadyForSpeech = false;
                taraConsecutiveErrors = 0;
                scheduleTaraRestart(noraConversationActive ? 450L : 900L);
            }'''
          new_segment = '''            @Override
            public void onSegmentResults(Bundle segmentResults) {
                clearPendingPartialWake();
                ArrayList<String> matches = segmentResults == null ? null : segmentResults.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                if (matches != null && !matches.isEmpty()) {
                    String segment = matches.get(0) == null ? "" : matches.get(0).trim();
                    if (!segment.isEmpty()) {
                        if (taraSegmentText.length() > 0) taraSegmentText.append(' ');
                        taraSegmentText.append(segment);
                    }
                }
                taraConsecutiveErrors = 0;
                taraListening = true;
            }

            @Override
            public void onEndOfSegmentedSession() {
                taraHandler.removeCallbacks(taraStartWatchdogRunnable);
                clearPendingPartialWake();
                String completedTurn = taraSegmentText.toString().trim();
                taraSegmentText.setLength(0);
                if (!completedTurn.isEmpty()) processNoraRecognitionText(completedTurn);
                closeTaraAudioPipe();
                taraListening = false;
                taraReadyForSpeech = false;
                taraConsecutiveErrors = 0;
                scheduleTaraRestart(noraConversationActive ? 180L : 700L);
            }'''
          main = replace_once(main, old_segment, new_segment, 'segmented callbacks')

          old_process = '''    private void processNoraRecognitionBundle(Bundle results) {
        ArrayList<String> matches = results == null ? null : results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
        if (matches == null || matches.isEmpty()) return;

        if (taraSpeaking) {
            handleTaraBargeInMatches(matches);
            return;
        }

        for (String match : matches) {
            if (match == null || match.trim().isEmpty()) continue;
            String canonical = canonicalizeNoraTranscript(match);
            String lower = canonical.trim().toLowerCase(Locale.ROOT);
            boolean explicitWake = lower.equals("shruthi") || lower.startsWith("shruthi ");

            if (System.currentTimeMillis() - taraSpeechEndedAt < 1400L && isLikelyTaraEcho(canonical)) {
                continue;
            }

            if (explicitWake) {
                if (!noraConversationActive && System.currentTimeMillis() < taraIgnoreWakeUntil) continue;
                activateNoraConversation();
            } else if (!noraConversationActive) {
                continue;
            } else {
                canonical = "SHRUTHI " + canonical;
            }

            dispatchTaraTranscriptDebounced(canonical);
            return;
        }
    }'''
          new_process = '''    private void processNoraRecognitionBundle(Bundle results) {
        ArrayList<String> matches = results == null ? null : results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
        if (matches == null || matches.isEmpty()) return;

        if (taraSpeaking) {
            handleTaraBargeInMatches(matches);
            return;
        }

        for (String match : matches) {
            if (match == null || match.trim().isEmpty()) continue;
            processNoraRecognitionText(match);
            return;
        }
    }

    private void processNoraRecognitionText(String rawText) {
        if (rawText == null || rawText.trim().isEmpty()) return;
        String canonical = canonicalizeNoraTranscript(rawText);
        String lower = canonical.trim().toLowerCase(Locale.ROOT);
        boolean explicitWake = lower.equals("shruthi") || lower.startsWith("shruthi ");

        if (System.currentTimeMillis() - taraSpeechEndedAt < 1400L && isLikelyTaraEcho(canonical)) return;

        if (explicitWake) {
            if (!noraConversationActive && System.currentTimeMillis() < taraIgnoreWakeUntil) return;
            activateNoraConversation();
        } else if (!noraConversationActive) {
            return;
        } else {
            canonical = "SHRUTHI " + canonical;
        }

        dispatchTaraTranscriptDebounced(canonical);
    }'''
          main = replace_once(main, old_process, new_process, 'recognition processor')

          main = main.replace('if (now - taraLastBargeInAt < 700L) return;', 'if (now - taraLastBargeInAt < 260L) return;')
          main = main.replace('taraHandler.postDelayed(taraPartialWakeDispatchRunnable, 260L);', 'taraHandler.postDelayed(taraPartialWakeDispatchRunnable, 180L);')
          main = main.replace('if (elapsed < 650L && (sameTranscript || !expandsPartialWake)) return;', 'if (elapsed < 260L && (sameTranscript || !expandsPartialWake)) return;')
          main = main.replace('delay = taraSegmentedSession ? 1200L : 1000L;', 'delay = taraSegmentedSession ? 650L : 600L;')
          main = main.replace('scheduleTaraRestart(active ? 350L : 800L);', 'scheduleTaraRestart(active ? 160L : 700L);')
          main = main.replace('scheduleTaraRestart(noraConversationActive ? 350L : 800L);', 'scheduleTaraRestart(noraConversationActive ? 160L : 700L);')
          main = main.replace('long minimumDelay = noraConversationActive ? 300L : 750L;', 'long minimumDelay = noraConversationActive ? 120L : 650L;')
          main = main.replace('scheduleTaraRestart(noraConversationActive ? 350L : 800L);', 'scheduleTaraRestart(noraConversationActive ? 160L : 700L);')

          insert_before = '''    private void dispatchTaraTranscript(String text) {
        WebView webView = bridge == null ? null : bridge.getWebView();'''
          insert_new = '''    private void dispatchTaraUserSpeechStart() {
        WebView webView = bridge == null ? null : bridge.getWebView();
        if (webView == null) return;
        String script = "window.dispatchEvent(new CustomEvent('centralhub:tara-user-speech-start'));";
        webView.post(() -> webView.evaluateJavascript(script, null));
    }

    private void dispatchTaraRms(float rmsDb) {
        long now = System.currentTimeMillis();
        if (now - taraLastRmsDispatchAt < 50L) return;
        taraLastRmsDispatchAt = now;
        double level = Math.max(0d, Math.min(1d, (rmsDb + 2d) / 12d));
        WebView webView = bridge == null ? null : bridge.getWebView();
        if (webView == null) return;
        String script = "window.dispatchEvent(new CustomEvent('centralhub:tara-rms',{detail:{level:" + level + "}}));";
        webView.post(() -> webView.evaluateJavascript(script, null));
    }

    private void dispatchTaraTranscript(String text) {
        WebView webView = bridge == null ? null : bridge.getWebView();'''
          main = replace_once(main, insert_before, insert_new, 'native event helpers')
          main_path.write_text(main)

          voice_path = Path('components/CentralHubVoiceAssistant.tsx')
          voice = voice_path.read_text()
          voice = replace_once(voice,
          '  const cloudAudioUrlRef = useRef<string | null>(null);',
          '  const cloudAudioUrlRef = useRef<string | null>(null);\n  const turnGenerationRef = useRef(0);',
          'turn generation ref')

          stop_anchor = '''  useEffect(() => () => {
    stopTracks();
    stopSpeech();
  }, [stopSpeech, stopTracks]);'''
          stop_new = '''  const interruptPendingTurn = useCallback(() => {
    turnGenerationRef.current += 1;
    processingRef.current = false;
    setProcessing(false);
    stopSpeech();
    setError('');
  }, [stopSpeech]);

  useEffect(() => () => {
    turnGenerationRef.current += 1;
    stopTracks();
    stopSpeech();
  }, [stopSpeech, stopTracks]);'''
          voice = replace_once(voice, stop_anchor, stop_new, 'interrupt helper')

          old_run_start = '''  const runCommand = useCallback(async (text: string) => {
    const clean = text.trim();
    if (!clean || processingRef.current) return;
    processingRef.current = true;'''
          new_run_start = '''  const runCommand = useCallback(async (text: string) => {
    const clean = text.trim();
    if (!clean) return;
    const turnGeneration = ++turnGenerationRef.current;
    processingRef.current = true;'''
          voice = replace_once(voice, old_run_start, new_run_start, 'run command start')

          voice = replace_once(voice,
          '''      if (await tryResumePendingBrowserQuestion(clean)) return;

      const mode = inferMode(pathname, clean);''',
          '''      if (await tryResumePendingBrowserQuestion(clean)) return;
      if (turnGeneration !== turnGenerationRef.current) return;

      const mode = inferMode(pathname, clean);''',
          'browser generation check')

          voice = replace_once(voice,
          '''      if (!result.success || !result.reply) throw new Error(result.error || 'Shruthi could not answer.');
      setResponse(result);''',
          '''      if (turnGeneration !== turnGenerationRef.current) return;
      if (!result.success || !result.reply) throw new Error(result.error || 'Shruthi could not answer.');
      setResponse(result);''',
          'result generation check')

          voice = replace_once(voice,
          '''    } catch (e: any) {
      setError(e?.message || 'Shruthi failed.');
      stopSpeech();
    } finally {
      processingRef.current = false;
      setProcessing(false);
    }
  }, [pathname, speak, stopSpeech, tryResumePendingBrowserQuestion]);''',
          '''    } catch (e: any) {
      if (turnGeneration !== turnGenerationRef.current) return;
      setError(e?.message || 'Shruthi failed.');
      stopSpeech();
    } finally {
      if (turnGeneration === turnGenerationRef.current) {
        processingRef.current = false;
        setProcessing(false);
      }
    }
  }, [pathname, speak, stopSpeech, tryResumePendingBrowserQuestion]);''',
          'run command finish')

          voice = replace_once(voice,
          '''  const handleNativeTranscript = useCallback((rawText: string) => {
    if (processingRef.current || recordingRef.current) return;''',
          '''  const handleNativeTranscript = useCallback((rawText: string) => {
    if (recordingRef.current) return;
    if (processingRef.current) interruptPendingTurn();''',
          'native transcript processing interruption')
          voice = voice.replace('  }, [chooseTheme, runCommand, setSession, speak]);', '  }, [chooseTheme, interruptPendingTurn, runCommand, setSession, speak]);', 1)

          effect_anchor = '''    const onTranscript = (event: Event) => {
      const text = String((event as NativeTranscriptEvent).detail?.text || '').trim();
      if (text) handleNativeTranscript(text);
    };
    window.addEventListener('centralhub:tara-transcript', onTranscript as EventListener);
    return () => {
      window.removeEventListener('centralhub:tara-transcript', onTranscript as EventListener);
      bridge?.setTaraEnabled?.(false);
    };
  }, [handleNativeTranscript]);'''
          effect_new = '''    const onSpeechStart = () => {
      if (noraSessionRef.current) interruptPendingTurn();
    };
    const onTranscript = (event: Event) => {
      const text = String((event as NativeTranscriptEvent).detail?.text || '').trim();
      if (text) handleNativeTranscript(text);
    };
    window.addEventListener('centralhub:tara-user-speech-start', onSpeechStart as EventListener);
    window.addEventListener('centralhub:tara-transcript', onTranscript as EventListener);
    return () => {
      window.removeEventListener('centralhub:tara-user-speech-start', onSpeechStart as EventListener);
      window.removeEventListener('centralhub:tara-transcript', onTranscript as EventListener);
      bridge?.setTaraEnabled?.(false);
    };
  }, [handleNativeTranscript, interruptPendingTurn]);'''
          voice = replace_once(voice, effect_anchor, effect_new, 'native speech start listener')
          voice_path.write_text(voice)

          enhancer_path = Path('components/ShruthiRealtimeVoiceEnhancer.tsx')
          enhancer = enhancer_path.read_text()
          enhancer = replace_once(enhancer,
          'type NativeTranscriptEvent = CustomEvent<{ text?: string; liveStable?: boolean }>;',
          'type NativeTranscriptEvent = CustomEvent<{ text?: string; liveStable?: boolean }>;\ntype NativeRmsEvent = CustomEvent<{ level?: number }>;',
          'native rms type')
          enhancer = replace_once(enhancer,
          '''  const screen = document.querySelector<HTMLElement>('.nora-screen');
  if (!screen) return;
  const stopButton = screen.querySelector<HTMLButtonElement>('button[aria-label="Stop listening"]');
  if (!stopButton) return;

  const bars = Array.from(screen.querySelectorAll<HTMLElement>('.nora-wavebar'));''',
          '''  const screen = document.querySelector<HTMLElement>('.nora-screen');
  if (!screen) return;

  const bars = Array.from(screen.querySelectorAll<HTMLElement>('.nora-wavebar'));''',
          'always listening bars')
          enhancer = replace_once(enhancer,
          '''    const onClickCapture = (event: Event) => {
      const target = event.target instanceof Element ? event.target.closest('button') : null;''',
          '''    const onNativeRms = (event: Event) => {
      const level = Number((event as NativeRmsEvent).detail?.level ?? 0);
      if (Number.isFinite(level)) setListeningBars(level);
    };

    const onClickCapture = (event: Event) => {
      const target = event.target instanceof Element ? event.target.closest('button') : null;''',
          'native rms handler')
          enhancer = replace_once(enhancer,
          '''    window.addEventListener('centralhub:tara-transcript', onTranscript as EventListener, true);
    document.addEventListener('click', onClickCapture, true);''',
          '''    window.addEventListener('centralhub:tara-transcript', onTranscript as EventListener, true);
    window.addEventListener('centralhub:tara-rms', onNativeRms as EventListener);
    document.addEventListener('click', onClickCapture, true);''',
          'rms listener attach')
          enhancer = replace_once(enhancer,
          '''      window.removeEventListener('centralhub:tara-transcript', onTranscript as EventListener, true);
      document.removeEventListener('click', onClickCapture, true);''',
          '''      window.removeEventListener('centralhub:tara-transcript', onTranscript as EventListener, true);
      window.removeEventListener('centralhub:tara-rms', onNativeRms as EventListener);
      document.removeEventListener('click', onClickCapture, true);''',
          'rms listener cleanup')
          enhancer_path.write_text(enhancer)
          PY

      - name: Verify targeted changes
        run: |
          grep -q "centralhub:tara-user-speech-start" android/app/src/main/java/com/centralhub/network/MainActivity.java
          grep -q "centralhub:tara-rms" android/app/src/main/java/com/centralhub/network/MainActivity.java
          grep -q "turnGenerationRef" components/CentralHubVoiceAssistant.tsx
          grep -q "onNativeRms" components/ShruthiRealtimeVoiceEnhancer.tsx

      - name: Commit patch
        run: |
          git config user.name "Tinu Antony"
          git config user.email "tinuan96@gmail.com"
          git add android/app/src/main/java/com/centralhub/network/MainActivity.java components/CentralHubVoiceAssistant.tsx components/ShruthiRealtimeVoiceEnhancer.tsx
          git commit -m "Fix Shruthi native realtime turn taking"
          git push origin HEAD:main
