name: One-off support inbox composer visibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-support-inbox-composer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Keep support inbox composer inside the mobile viewport
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/customer-care/inbox/InboxClient.tsx')
          s = p.read_text()
          old = '    <div className="flex h-[calc(100dvh-64px)] max-h-[calc(100dvh-64px)] w-full max-w-full min-h-0 overflow-hidden relative bg-slate-950">'
          new = '    <div className="flex h-full max-h-full w-full max-w-full min-h-0 overflow-hidden relative bg-slate-950">'
          if old not in s:
              raise SystemExit('Inbox viewport marker not found')
          s = s.replace(old, new, 1)
          old_footer = '            <footer className="shrink-0 border-t border-slate-800 bg-slate-900 px-2 sm:px-3 lg:px-4 pt-2 sm:pt-3 pb-[calc(0.45rem+env(safe-area-inset-bottom))] sm:pb-[calc(0.75rem+env(safe-area-inset-bottom))]">'
          new_footer = '            <footer className="relative z-30 shrink-0 border-t border-slate-800 bg-slate-900 px-2 sm:px-3 lg:px-4 pt-2 sm:pt-3 pb-[calc(0.45rem+env(safe-area-inset-bottom))] sm:pb-[calc(0.75rem+env(safe-area-inset-bottom))]">'
          if old_footer not in s:
              raise SystemExit('Inbox composer footer marker not found')
          s = s.replace(old_footer, new_footer, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Smoke audit
        run: npm run audit:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Commit verified inbox fix and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-support-inbox-composer.yml
          git config user.name "centralhub-automation"
          git config user.email "centralhub-automation@users.noreply.github.com"
          git add app/customer-care/inbox/InboxClient.tsx .github/workflows/fix-support-inbox-composer.yml
          git commit -m "fix: keep support inbox chat composer visible"
          git push origin HEAD:main
