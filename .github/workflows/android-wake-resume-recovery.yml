name: Android Wake Resume Recovery

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-wake-resume-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Samsung Android wake recovery
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/java/com/centralhub/network/MainActivity.java')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    private final Runnable taraRestartRunnable = this::startTaraRecognizerIfReady;\n',
              '    private final Runnable taraRestartRunnable = this::startTaraRecognizerIfReady;\n'
              '    private final Runnable taraStartWatchdogRunnable = this::recoverStalledTaraStart;\n',
              'watchdog runnable',
          )

          replace_once(
              '    private boolean taraListening = false;\n',
              '    private boolean taraListening = false;\n'
              '    private boolean taraReadyForSpeech = false;\n',
              'ready flag',
          )

          replace_once(
              '            @Override public void onReadyForSpeech(Bundle params) { taraListening = true; }\n',
              '            @Override\n'
              '            public void onReadyForSpeech(Bundle params) {\n'
              '                taraHandler.removeCallbacks(taraStartWatchdogRunnable);\n'
              '                taraReadyForSpeech = true;\n'
              '                taraListening = true;\n'
              '                taraConsecutiveErrors = 0;\n'
              '            }\n',
              'ready callback',
          )

          replace_once(
              '            public void onError(int error) {\n'
              '                taraListening = false;\n'
              '                taraPartialWakeDispatched = false;\n'
              '                if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) return;\n\n'
              '                taraConsecutiveErrors += 1;\n',
              '            public void onError(int error) {\n'
              '                taraHandler.removeCallbacks(taraStartWatchdogRunnable);\n'
              '                taraListening = false;\n'
              '                taraReadyForSpeech = false;\n'
              '                taraPartialWakeDispatched = false;\n'
              '                if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) return;\n\n'
              '                taraConsecutiveErrors += 1;\n'
              '                if (error == SpeechRecognizer.ERROR_RECOGNIZER_BUSY\n'
              '                        || error == SpeechRecognizer.ERROR_CLIENT\n'
              '                        || (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S\n'
              '                        && error == SpeechRecognizer.ERROR_SERVER_DISCONNECTED)) {\n'
              '                    // Samsung/Bixby can leave Android SpeechRecognizer bound to a stale\n'
              '                    // recognition service after audio focus or app lifecycle changes.\n'
              '                    // Recreate the native recognizer instead of retrying the dead instance.\n'
              '                    destroyTaraRecognizer();\n'
              '                    scheduleTaraRestart(noraConversationActive ? 700L : 1800L);\n'
              '                    return;\n'
              '                }\n',
              'error recovery',
          )

          replace_once(
              '            public void onResults(Bundle results) {\n'
              '                processNoraRecognitionBundle(results);\n'
              '                taraListening = false;\n',
              '            public void onResults(Bundle results) {\n'
              '                taraHandler.removeCallbacks(taraStartWatchdogRunnable);\n'
              '                processNoraRecognitionBundle(results);\n'
              '                taraListening = false;\n'
              '                taraReadyForSpeech = false;\n',
              'results recovery',
          )

          replace_once(
              '            public void onEndOfSegmentedSession() {\n'
              '                taraListening = false;\n',
              '            public void onEndOfSegmentedSession() {\n'
              '                taraHandler.removeCallbacks(taraStartWatchdogRunnable);\n'
              '                taraListening = false;\n'
              '                taraReadyForSpeech = false;\n',
              'segmented end recovery',
          )

          replace_once(
              '    public void setTaraEnabled(boolean enabled) {\n'
              '        taraEnabled = enabled;\n'
              '        if (!enabled) {\n'
              '            noraConversationActive = false;\n'
              '            stopTaraRecognizer();\n'
              '            return;\n'
              '        }\n'
              '        if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {\n'
              '            requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQUEST_RECORD_AUDIO);\n'
              '            return;\n'
              '        }\n'
              '        startTaraRecognizerIfReady();\n'
              '    }\n',
              '    public void setTaraEnabled(boolean enabled) {\n'
              '        boolean wasEnabled = taraEnabled;\n'
              '        taraEnabled = enabled;\n'
              '        if (!enabled) {\n'
              '            noraConversationActive = false;\n'
              '            destroyTaraRecognizer();\n'
              '            return;\n'
              '        }\n'
              '        if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {\n'
              '            requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQUEST_RECORD_AUDIO);\n'
              '            return;\n'
              '        }\n'
              '        if (!wasEnabled || taraRecognizer == null || taraRecognizerIntent == null) {\n'
              '            setupTaraRecognizer();\n'
              '        }\n'
              '        scheduleTaraRestart(450L);\n'
              '    }\n',
              'enable lifecycle',
          )

          replace_once(
              '        try {\n'
              '            taraHandler.removeCallbacks(taraRestartRunnable);\n'
              '            taraPartialWakeDispatched = false;\n'
              '            taraRecognizer.startListening(taraRecognizerIntent);\n'
              '            taraListening = true;\n'
              '        } catch (Exception ignored) {\n'
              '            taraListening = false;\n'
              '            taraConsecutiveErrors += 1;\n'
              '            scheduleTaraRestart(Math.min(12000L, 2800L + (taraConsecutiveErrors * 1200L)));\n'
              '        }\n'
              '    }\n\n'
              '    private void scheduleTaraRestart(long delayMs) {\n',
              '        try {\n'
              '            taraHandler.removeCallbacks(taraRestartRunnable);\n'
              '            taraHandler.removeCallbacks(taraStartWatchdogRunnable);\n'
              '            taraPartialWakeDispatched = false;\n'
              '            taraReadyForSpeech = false;\n'
              '            taraRecognizer.startListening(taraRecognizerIntent);\n'
              '            taraListening = true;\n'
              '            // startListening() can return successfully even when Samsung has handed\n'
              '            // us a stale recognizer after an app switch. If onReadyForSpeech never\n'
              '            // arrives, recycle the recognizer instead of remaining silently stuck.\n'
              '            taraHandler.postDelayed(taraStartWatchdogRunnable, 3500L);\n'
              '        } catch (Exception ignored) {\n'
              '            taraListening = false;\n'
              '            taraReadyForSpeech = false;\n'
              '            taraConsecutiveErrors += 1;\n'
              '            destroyTaraRecognizer();\n'
              '            scheduleTaraRestart(Math.min(12000L, 2800L + (taraConsecutiveErrors * 1200L)));\n'
              '        }\n'
              '    }\n\n'
              '    private void recoverStalledTaraStart() {\n'
              '        if (!taraEnabled || !taraResumed || taraSpeaking || !taraListening || taraReadyForSpeech) return;\n'
              '        taraConsecutiveErrors += 1;\n'
              '        destroyTaraRecognizer();\n'
              '        scheduleTaraRestart(noraConversationActive ? 700L : 1800L);\n'
              '    }\n\n'
              '    private void scheduleTaraRestart(long delayMs) {\n',
              'start watchdog',
          )

          replace_once(
              '    private void stopTaraRecognizer() {\n'
              '        taraHandler.removeCallbacks(taraRestartRunnable);\n'
              '        taraListening = false;\n'
              '        taraPartialWakeDispatched = false;\n',
              '    private void stopTaraRecognizer() {\n'
              '        taraHandler.removeCallbacks(taraRestartRunnable);\n'
              '        taraHandler.removeCallbacks(taraStartWatchdogRunnable);\n'
              '        taraListening = false;\n'
              '        taraReadyForSpeech = false;\n'
              '        taraPartialWakeDispatched = false;\n',
              'stop cleanup',
          )

          replace_once(
              '    private void destroyTaraRecognizer() {\n'
              '        taraHandler.removeCallbacks(taraRestartRunnable);\n'
              '        taraListening = false;\n'
              '        taraPartialWakeDispatched = false;\n',
              '    private void destroyTaraRecognizer() {\n'
              '        taraHandler.removeCallbacks(taraRestartRunnable);\n'
              '        taraHandler.removeCallbacks(taraStartWatchdogRunnable);\n'
              '        taraListening = false;\n'
              '        taraReadyForSpeech = false;\n'
              '        taraPartialWakeDispatched = false;\n',
              'destroy cleanup',
          )

          replace_once(
              '        boolean expandsPartialWake = "NORA".equalsIgnoreCase(taraLastTranscriptText)\n'
              '                && clean.length() > 5\n'
              '                && clean.regionMatches(true, 0, "NORA ", 0, 5);\n',
              '        boolean expandsPartialWake = "SHRUTHI".equalsIgnoreCase(taraLastTranscriptText)\n'
              '                && clean.length() > 8\n'
              '                && clean.regionMatches(true, 0, "SHRUTHI ", 0, 8);\n',
              'wake debounce alias',
          )

          replace_once(
              '    public void onResume() {\n'
              '        super.onResume();\n'
              '        taraResumed = true;\n'
              '        scheduleTaraRestart(noraConversationActive ? 600L : 1800L);\n'
              '    }\n\n'
              '    @Override\n'
              '    public void onPause() {\n'
              '        taraResumed = false;\n'
              '        // Keep the conversation state while the app is backgrounded or temporarily\n'
              '        // covered by NORA Computer Mode. The microphone itself is always paused.\n'
              '        stopTaraRecognizer();\n'
              '        super.onPause();\n'
              '    }\n',
              '    public void onResume() {\n'
              '        super.onResume();\n'
              '        taraResumed = true;\n'
              '        if (taraEnabled\n'
              '                && checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED\n'
              '                && (taraRecognizer == null || taraRecognizerIntent == null)) {\n'
              '            setupTaraRecognizer();\n'
              '        }\n'
              '        scheduleTaraRestart(noraConversationActive ? 600L : 1800L);\n'
              '    }\n\n'
              '    @Override\n'
              '    public void onPause() {\n'
              '        taraResumed = false;\n'
              '        // Android only grants this app microphone access while it is foregrounded.\n'
              '        // Destroy the recognizer here so Samsung/Bixby cannot leave a cancelled,\n'
              '        // non-responsive SpeechRecognizer instance behind for the next resume.\n'
              '        // Conversation state is preserved and the recognizer is rebuilt on resume.\n'
              '        destroyTaraRecognizer();\n'
              '        super.onPause();\n'
              '    }\n',
              'activity lifecycle',
          )

          replace_once(
              '        if (requestCode == REQUEST_RECORD_AUDIO\n'
              '                && grantResults.length > 0\n'
              '                && grantResults[0] == PackageManager.PERMISSION_GRANTED) {\n'
              '            scheduleTaraRestart(1800L);\n'
              '        }\n',
              '        if (requestCode == REQUEST_RECORD_AUDIO\n'
              '                && grantResults.length > 0\n'
              '                && grantResults[0] == PackageManager.PERMISSION_GRANTED) {\n'
              '            if (taraEnabled && taraResumed) setupTaraRecognizer();\n'
              '            scheduleTaraRestart(900L);\n'
              '        }\n',
              'permission recovery',
          )

          path.write_text(text)
          PY

      - name: Verify wake recovery patch
        shell: bash
        run: |
          grep -F 'taraStartWatchdogRunnable' android/app/src/main/java/com/centralhub/network/MainActivity.java
          grep -F 'recoverStalledTaraStart' android/app/src/main/java/com/centralhub/network/MainActivity.java
          grep -F 'destroyTaraRecognizer();' android/app/src/main/java/com/centralhub/network/MainActivity.java
          grep -F 'boolean wasEnabled = taraEnabled;' android/app/src/main/java/com/centralhub/network/MainActivity.java
          grep -F '"SHRUTHI".equalsIgnoreCase(taraLastTranscriptText)' android/app/src/main/java/com/centralhub/network/MainActivity.java

      - name: Commit patch and remove one-time runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/android-wake-resume-recovery.yml
          git add android/app/src/main/java/com/centralhub/network/MainActivity.java
          git commit -m 'fix(android): rebuild wake listener after app resume'
          git push origin HEAD:main
