name: One-off Shruthi wake and voice safety fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shruthi-wake-voice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Apply Shruthi wake and voice safety patch
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Native wake: explicit Shruthi/NORA only. No Tara aliases and no
          # ambient follow-up reopening after the UI has been closed.
          p = Path('android/app/src/main/java/com/centralhub/network/MainActivity.java')
          s = p.read_text()
          old_bias = '''new ArrayList<>(Arrays.asList(
                            "NORA", "Nora", "Norah", "Noora", "Noura", "Hey NORA", "Hey Nora",
                            "നോറ", "നോറാ", "நோரா",
                            // Narrow legacy compatibility only; broad aliases such as
                            // Sarah/Terra caused false background wakes.
                            "Tara", "Thara", "താര", "താരാ", "தாரா"
                    ))'''
          new_bias = '''new ArrayList<>(Arrays.asList(
                            "Shruthi", "Sruthi", "Shruti", "Hey Shruthi", "Hey Sruthi", "Hey Shruti",
                            "ശ്രുതി", "ஸ்ருதி",
                            // NORA remains a narrow legacy alias only.
                            "NORA", "Nora", "Norah", "Noora", "Noura", "Hey NORA", "Hey Nora",
                            "നോറ", "നോറാ", "நோரா"
                    ))'''
          assert old_bias in s, 'wake bias block changed unexpectedly'
          s = s.replace(old_bias, new_bias)
          s = s.replace('boolean explicitWake = lower.equals("nora") || lower.startsWith("nora ");', 'boolean explicitWake = lower.equals("shruthi") || lower.startsWith("shruthi ");')
          s = s.replace('canonical = "NORA " + canonical;', 'canonical = "SHRUTHI " + canonical;')

          methods = re.compile(r'''    private String canonicalizeNoraTranscript\(String raw\) \{.*?\n    \}\n\n    private boolean isSimpleNoraWakePhrase\(String raw\) \{.*?\n    \}''', re.S)
          replacement = '''    private String canonicalizeNoraTranscript(String raw) {
        if (raw == null) return "";
        String clean = raw.trim();
        if (clean.isEmpty()) return clean;

        String normalized = clean.toLowerCase(Locale.ROOT);
        String[] shruthiVariants = new String[]{"shruthi", "sruthi", "shruti"};
        for (String variant : shruthiVariants) {
            if (normalized.equals(variant) || normalized.equals("hey " + variant)) return "SHRUTHI";
            if (normalized.startsWith(variant + " ")) return "SHRUTHI " + clean.substring(variant.length()).trim();
            String heyVariant = "hey " + variant + " ";
            if (normalized.startsWith(heyVariant)) return "SHRUTHI " + clean.substring(heyVariant.length()).trim();
        }
        if (normalized.equals("ശ്രുതി") || normalized.equals("ஸ்ருதி")) return "SHRUTHI";
        if (normalized.startsWith("ശ്രുതി ")) return "SHRUTHI " + clean.substring("ശ്രുതി".length()).trim();
        if (normalized.startsWith("ஸ்ருதி ")) return "SHRUTHI " + clean.substring("ஸ்ருதி".length()).trim();

        // NORA remains a narrow legacy alias. Tara/Thara are intentionally not
        // wake aliases anymore because they can activate from unrelated speech.
        String[] noraVariants = new String[]{"nora", "norah", "noora", "noura", "norra", "nora's"};
        for (String variant : noraVariants) {
            if (normalized.equals(variant) || normalized.equals("hey " + variant)) return "SHRUTHI";
            if (normalized.startsWith(variant + " ")) return "SHRUTHI " + clean.substring(variant.length()).trim();
            String heyVariant = "hey " + variant + " ";
            if (normalized.startsWith(heyVariant)) return "SHRUTHI " + clean.substring(heyVariant.length()).trim();
        }
        if (normalized.equals("നോറ") || normalized.equals("നോറാ") || normalized.equals("நோரா")) return "SHRUTHI";
        return clean;
    }

    private boolean isSimpleNoraWakePhrase(String raw) {
        if (raw == null) return false;
        String canonical = canonicalizeNoraTranscript(raw);
        String normalized = canonical.trim().toLowerCase(Locale.ROOT).replaceAll("[\\\\p{Punct}\\\\s]+", " ").trim();
        if (normalized.length() > 18) return false;
        return normalized.equals("shruthi");
    }'''
          s2, count = methods.subn(replacement, s, count=1)
          assert count == 1, f'expected one native wake method block, got {count}'
          p.write_text(s2)

          # 2) Web assistant: never fall back to an arbitrary (often male) system
          # voice. If no explicitly feminine voice is available, remain silent
          # until the approved Shruthi voice provider is connected.
          p = Path('components/CentralHubVoiceAssistant.tsx')
          s = p.read_text()
          old_pick = "return pool.find((voice) => FEMALE_VOICE_HINTS.some((hint) => voice.name.toLowerCase().includes(hint))) || pool[0] || voices[0];"
          new_pick = "return pool.find((voice) => FEMALE_VOICE_HINTS.some((hint) => voice.name.toLowerCase().includes(hint))) || voices.find((voice) => FEMALE_VOICE_HINTS.some((hint) => voice.name.toLowerCase().includes(hint)));"
          assert old_pick in s, 'web voice picker changed unexpectedly'
          s = s.replace(old_pick, new_pick)
          old_voice = '''    const preferred = pickExecutiveVoice(window.speechSynthesis.getVoices(), language);
    if (preferred) utterance.voice = preferred;

    const finish = () => {'''
          new_voice = '''    const preferred = pickExecutiveVoice(window.speechSynthesis.getVoices(), language);
    if (!preferred) {
      bridge?.setTaraSpeaking?.(false);
      if (speechVisualTimerRef.current) window.clearTimeout(speechVisualTimerRef.current);
      speechVisualTimerRef.current = null;
      setSpeaking(false);
      return;
    }
    utterance.voice = preferred;

    const finish = () => {'''
          assert old_voice in s, 'web voice fallback block changed unexpectedly'
          s = s.replace(old_voice, new_voice)
          s = s.replace("nativeWakeAvailable ? 'Say “NORA” · legacy wake' : 'Ready';", "nativeWakeAvailable ? 'Say “SHRUTHI”' : 'Ready';")
          old_nav = "onClick={() => { router.push(response.navigation_path!); setOpen(false); }}"
          new_nav = "onClick={() => { setSession(false); router.push(response.navigation_path!); setOpen(false); }}"
          assert old_nav in s, 'assistant navigation close handler changed unexpectedly'
          s = s.replace(old_nav, new_nav)
          p.write_text(s)

          # 3) Native TTS: do not use the first available voice as a fallback.
          # That fallback is what can select a male system voice on Samsung.
          p = Path('android/app/src/main/java/com/centralhub/network/CentralHubNativeBridge.java')
          s = p.read_text()
          old_call = '''            Locale selected = selectSupportedLocale(tts, locale);
            tts.setLanguage(selected);
            tts.setSpeechRate(0.93f);
            tts.setPitch(1.04f);
            selectExecutiveVoice(tts, selected);
            int result = tts.speak('''
          new_call = '''            Locale selected = selectSupportedLocale(tts, locale);
            if (!selectExecutiveVoice(tts, selected)) {
                activity.setTaraSpeaking(false);
                return;
            }
            tts.setLanguage(selected);
            tts.setSpeechRate(0.93f);
            tts.setPitch(1.04f);
            int result = tts.speak('''
          assert old_call in s, 'native TTS call block changed unexpectedly'
          s = s.replace(old_call, new_call)
          old_method = re.compile(r'''    private void selectExecutiveVoice\(TextToSpeech tts, Locale locale\) \{.*?\n    \}\n\n    public void shutdown''', re.S)
          new_method = '''    private boolean selectExecutiveVoice(TextToSpeech tts, Locale locale) {
        if (Build.VERSION.SDK_INT < Build.VERSION_CODES.LOLLIPOP) return false;
        try {
            Set<Voice> voices = tts.getVoices();
            if (voices == null || voices.isEmpty()) return false;
            for (Voice voice : voices) {
                if (voice == null || voice.getLocale() == null) continue;
                if (!voice.getLocale().getLanguage().equalsIgnoreCase(locale.getLanguage())) continue;
                String name = voice.getName() == null ? "" : voice.getName().toLowerCase(Locale.ROOT);
                if (name.contains("female")
                        || name.contains("sonia")
                        || name.contains("serena")
                        || name.contains("samantha")
                        || name.contains("aria")
                        || name.contains("ava")
                        || name.contains("veena")
                        || name.contains("heera")
                        || name.contains("hazel")
                        || name.contains("susan")) {
                    return tts.setVoice(voice) == TextToSpeech.SUCCESS;
                }
            }
        } catch (Exception ignored) { }
        return false;
    }

    public void shutdown'''
          s2, count = old_method.subn(new_method, s, count=1)
          assert count == 1, f'expected one native voice selector, got {count}'
          p.write_text(s2)

      - name: Install dependencies
        run: npm ci

      - name: Dependency high severity security gate
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Runtime compatibility audit
        run: npm run audit:runtime

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Post-build smoke audit
        run: npm run audit:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Commit verified fix and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-shruthi-wake-voice.yml
          git config user.name "centralhub-automation"
          git config user.email "centralhub-automation@users.noreply.github.com"
          git add android/app/src/main/java/com/centralhub/network/MainActivity.java \
                  android/app/src/main/java/com/centralhub/network/CentralHubNativeBridge.java \
                  components/CentralHubVoiceAssistant.tsx \
                  .github/workflows/fix-shruthi-wake-voice.yml
          git commit -m "fix: require explicit Shruthi wake and block male TTS fallback"
          git push origin HEAD:main
