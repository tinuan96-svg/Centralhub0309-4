name: One-off Shruthi wake and voice safety fix v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shruthi-wake-voice-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Apply explicit Shruthi wake and voice safety patch
        shell: bash
        run: |
          echo '_fOCuuOCvjeCusOCvgeCupOCuv3zgtKjgtYvgtLHgtL4_fOCuqOCvi-CusOCuvj8vaXU7XG4iLAogICAgcywKICAgIGNvdW50PTEsCikKb2xkX3BpY2sgPSAicmV0dXJuIHBvb2wuZmluZCgodm9pY2UpID0-- IHZvaWNlLm5hbWUudG9Mb3dlckNhc2UoKS5pbmNsdWRlcyhoaW50KSkpIHx8IHZvaWNlcy5maW5kKCh2b2ljZSkgPT4gRkVNQUxFX1ZPSUNFX0hJTlRTLnNvbWUoKGhpbnQpID0- -IHsnJycKbmV3X3ByZWZlcnJlZCA9ICcnJyAgICBjb25zdCBwcmVmZXJyZWQgPSBwaWNrRXhlY3V0aXZlVm9pY2Uod2luZG93LnNwZWVjaFN5bnRoZXNpcy5nZXRWb2ljZXMoKSwgbGFuZ3VhZ2UpOwogICAgaWYgKCFwcmVmZXJyZWQpIHsKICAgICAgYnJpZGdlPy5zZXRUYXJhU3BlYWtpbmc__ICdTYXkg4oCcU0hSVVRISeKAnScgOiAnUmVhZHknOyIpCm9sZF9uYXYgPSAib25DbGljaz17KCkgPT4geyByb3V0ZXIucHVzaChyZXNwb25zZS5uYXZpZ2F0aW9uX3BhdGghKTsgc2V0T3BlbihmYWxzZSk7IH19IgptdXN0KG9sZF9uYXYgaW4gcywgImFzc2lzdGFudCBuYXZpZ2F0aW9uIGNsb3NlIGhhbmRsZXIgbWlzc2luZyIpCnMgPSBzLnJlcGxhY2Uob2xkX25hdiwgIm9uQ2xpY2s9eygpID0-- ' | base64 -d > /tmp/fix_shruthi.py
          python3 /tmp/fix_shruthi.py

      - name: Install dependencies
        run: npm ci

      - name: Dependency high severity security gate
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Runtime compatibility audit
        run: npm run audit:runtime

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Post-build smoke audit
        run: npm run audit:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Commit verified fix and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-shruthi-wake-voice-v3.yml
          git config user.name "centralhub-automation"
          git config user.email "centralhub-automation@users.noreply.github.com"
          git add android/app/src/main/java/com/centralhub/network/MainActivity.java \
                  android/app/src/main/java/com/centralhub/network/CentralHubNativeBridge.java \
                  components/CentralHubVoiceAssistant.tsx \
                  .github/workflows/fix-shruthi-wake-voice-v3.yml
          git commit -m "fix: require explicit Shruthi wake and block male TTS fallback"
          git push origin HEAD:main
