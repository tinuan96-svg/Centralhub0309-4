name: Native Wake Recovery Hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-wake-recovery-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Android wake listener
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/java/com/centralhub/network/MainActivity.java')
          s = p.read_text()

          new_method = '''    public void setTaraEnabled(boolean enabled) {
              boolean wasEnabled = taraEnabled;
              taraEnabled = enabled;
              if (!enabled) {
                  noraConversationActive = false;
                  destroyTaraRecognizer();
                  return;
              }
              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQUEST_RECORD_AUDIO);
                  return;
              }
              if (!wasEnabled || taraRecognizer == null || taraRecognizerIntent == null) {
                  setupTaraRecognizer();
              }
              scheduleTaraRestart(450L);
          }

'''
          method_pattern = re.compile(
              r'    public void setTaraEnabled\(boolean enabled\) \{.*?\n    \}\n\n(?=    public void setNoraConversationActive)',
              re.S,
          )
          if 'boolean wasEnabled = taraEnabled;' not in s:
              s, count = method_pattern.subn(new_method, s, count=1)
              if count != 1:
                  raise SystemExit('Could not safely locate setTaraEnabled method')

          new_resume = '''    public void onResume() {
              super.onResume();
              taraResumed = true;
              if (taraEnabled
                      && taraRecognizer == null
                      && checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                  setupTaraRecognizer();
              }
              scheduleTaraRestart(noraConversationActive ? 600L : 1800L);
          }

'''
          resume_pattern = re.compile(
              r'    public void onResume\(\) \{.*?\n    \}\n\n(?=    @Override\n    public void onPause)',
              re.S,
          )
          if '&& taraRecognizer == null' not in s[s.find('public void onResume()'):s.find('public void onPause()')]:
              s, count = resume_pattern.subn(new_resume, s, count=1)
              if count != 1:
                  raise SystemExit('Could not safely locate onResume method')

          p.write_text(s)
          PY

      - name: Verify native patch
        run: |
          grep -F "boolean wasEnabled = taraEnabled;" android/app/src/main/java/com/centralhub/network/MainActivity.java
          grep -F "destroyTaraRecognizer();" android/app/src/main/java/com/centralhub/network/MainActivity.java
          grep -F "scheduleTaraRestart(450L);" android/app/src/main/java/com/centralhub/network/MainActivity.java

      - name: Commit native patch
        run: |
          if git diff --quiet; then
            echo "Native patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/centralhub/network/MainActivity.java
          git commit -m "fix(android): recreate wake listener after picking"
          git push origin HEAD:main
