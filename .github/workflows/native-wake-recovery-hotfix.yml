name: Native Wake Recovery Hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-wake-recovery-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Android wake listener
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/centralhub/network/MainActivity.java')
          s = p.read_text()

          old = """    public void setTaraEnabled(boolean enabled) {
              taraEnabled = enabled;
              if (!enabled) {
                  noraConversationActive = false;
                  stopTaraRecognizer();
                  return;
              }
              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQUEST_RECORD_AUDIO);
                  return;
              }
              startTaraRecognizerIfReady();
          }
          """
          new = """    public void setTaraEnabled(boolean enabled) {
              boolean wasEnabled = taraEnabled;
              taraEnabled = enabled;
              if (!enabled) {
                  noraConversationActive = false;
                  destroyTaraRecognizer();
                  return;
              }
              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQUEST_RECORD_AUDIO);
                  return;
              }
              if (!wasEnabled || taraRecognizer == null || taraRecognizerIntent == null) {
                  setupTaraRecognizer();
              }
              scheduleTaraRestart(450L);
          }
          """
          if new not in s:
              if old not in s:
                  raise SystemExit('setTaraEnabled source block not found')
              s = s.replace(old, new, 1)

          old_resume = """    public void onResume() {
              super.onResume();
              taraResumed = true;
              scheduleTaraRestart(noraConversationActive ? 600L : 1800L);
          }
          """
          new_resume = """    public void onResume() {
              super.onResume();
              taraResumed = true;
              if (taraEnabled
                      && taraRecognizer == null
                      && checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                  setupTaraRecognizer();
              }
              scheduleTaraRestart(noraConversationActive ? 600L : 1800L);
          }
          """
          if new_resume not in s:
              if old_resume not in s:
                  raise SystemExit('onResume source block not found')
              s = s.replace(old_resume, new_resume, 1)

          p.write_text(s)
          PY

      - name: Verify native patch
        run: |
          grep -F "boolean wasEnabled = taraEnabled;" android/app/src/main/java/com/centralhub/network/MainActivity.java
          grep -F "scheduleTaraRestart(450L);" android/app/src/main/java/com/centralhub/network/MainActivity.java

      - name: Commit native patch
        run: |
          if git diff --quiet; then
            echo "Native patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/centralhub/network/MainActivity.java
          git commit -m "fix(android): recreate wake listener after picking"
          git push origin HEAD:main
