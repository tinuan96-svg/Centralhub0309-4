name: CB validation

on:
  push:
    branches: [CB]
  pull_request:
    branches: [CB]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --include=dev
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run audit:routes
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run audit:smoke
