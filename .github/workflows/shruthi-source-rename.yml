name: One-off Shruthi source identity migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shruthi-source-rename.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Make Shruthi the primary user-facing identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def write(path: str, text: str):
              Path(path).write_text(text, encoding='utf-8')

          def require_replace(text: str, old: str, new: str, label: str):
              if old not in text:
                  raise SystemExit(f'missing expected source for {label}: {old[:120]}')
              return text.replace(old, new)

          # Main voice UI: preserve lower-case nora_* technical identifiers/classes,
          # but make Shruthi the actual identity shown/spoken by the React UI.
          path = 'components/CentralHubVoiceAssistant.tsx'
          text = Path(path).read_text(encoding='utf-8')
          text = text.replace('NORA', 'SHRUTHI')
          text = text.replace('SHRUTHI request failed.', 'Shruthi request failed.')
          text = text.replace('SHRUTHI could not answer.', 'Shruthi could not answer.')
          text = text.replace('SHRUTHI failed.', 'Shruthi failed.')
          text = text.replace("speak('Of course. I’ll stay quiet until you call SHRUTHI again.');", "speak('Of course. I’ll stay quiet until you call me again.');")
          text = text.replace("nativeWakeAvailable ? 'Say “SHRUTHI”' : 'Ready';", "nativeWakeAvailable ? 'Say “NORA” · legacy wake' : 'Ready';")
          text = require_replace(text,
              '(nora|norah|noora|noura|norra|tara|thara)',
              '(shruthi|sruthi|shruti|nora|norah|noora|noura|norra|tara|thara)',
              'voice wake aliases')
          text = require_replace(text,
              '|നോറാ?|நோரா?|താരാ?|தாரா?',
              '|ശ്രുതി|ஸ்ருதி|നോറാ?|நோரா?|താരാ?|தாரா?',
              'Malayalam/Tamil Shruthi wake aliases')
          text = require_replace(text,
              '(?:nora|norah|noora)\\s+stop|stop\\s+(?:nora|norah|noora)',
              '(?:shruthi|sruthi|shruti|nora|norah|noora)\\s+stop|stop\\s+(?:shruthi|sruthi|shruti|nora|norah|noora)',
              'voice stop aliases')
          text = text.replace('thank you nora|thanks nora|go to sleep|sleep nora', 'thank you shruthi|thanks shruthi|thank you nora|thanks nora|go to sleep|sleep shruthi|sleep nora')
          text = text.replace('|നോറാ?\\s*(?:സ്റ്റോപ്പ്|മതി|നിർത്തു)', '|ശ്രുതി\\s*(?:സ്റ്റോപ്പ്|മതി|നിർത്തു)|നോറാ?\\s*(?:സ്റ്റോപ്പ്|മതി|നിർത്തു)')
          text = text.replace('|(?:മതി|നിർത്തു)\\s*നോറാ?', '|(?:മതി|നിർത്തു)\\s*(?:ശ്രുതി|നോറാ?)')
          text = text.replace('|நோரா?\\s*(?:ஸ்டாப்|போதும்)', '|ஸ்ருதி\\s*(?:ஸ்டாப்|போதும்)|நோரா?\\s*(?:ஸ்டாப்|போதும்)')
          write(path, text)

          # Adaptive turn normalizer: accept Shruthi/Sruthi/Shruti while retaining NORA.
          path = 'components/NoraAdaptiveVoiceNormalizer.tsx'
          text = Path(path).read_text(encoding='utf-8')
          text = text.replace('NORA', 'SHRUTHI')
          text = require_replace(text,
              '(?:nora|norah|noora|noura|norra|tara|thara)',
              '(?:shruthi|sruthi|shruti|nora|norah|noora|noura|norra|tara|thara)',
              'normalizer wake aliases')
          text = require_replace(text,
              "const exactWake = /^SHRUTHI$/iu.test(clean);",
              "const exactWake = /^(?:SHRUTHI|NORA)$/iu.test(clean);",
              'normalizer exact legacy wake')
          text = text.replace('(?:nora|norah|noora)\\s+stop|stop\\s+(?:nora|norah|noora)', '(?:shruthi|sruthi|shruti|nora|norah|noora)\\s+stop|stop\\s+(?:shruthi|sruthi|shruti|nora|norah|noora)')
          text = text.replace('thank you nora|thanks nora|go to sleep|sleep nora', 'thank you shruthi|thanks shruthi|thank you nora|thanks nora|go to sleep|sleep shruthi|sleep nora')
          write(path, text)

          # Live Action UI: user-facing copy becomes Shruthi; nora_* table/channel names remain intact.
          for path in ['components/NoraLiveActionOverlay.tsx', 'components/NoraComputerLauncher.tsx']:
              text = Path(path).read_text(encoding='utf-8')
              text = text.replace('NORA', 'Shruthi')
              write(path, text)

          # The skin no longer needs to spoof the H2 now that the source says Shruthi.
          path = 'components/ShruthiIdentitySkin.tsx'
          text = Path(path).read_text(encoding='utf-8')
          h2_block = """      .nora-screen h2 {\n        font-size: 0 !important;\n      }\n\n      .nora-screen h2::after {\n        content: 'SHRUTHI · ശ്രുതി';\n        display: inline-block;\n        font-size: 2.25rem;\n        line-height: 1;\n        font-weight: 300;\n        letter-spacing: -0.02em;\n      }\n\n"""
          text = require_replace(text, h2_block, '', 'Shruthi title CSS shim')
          text = text.replace("""      @media (min-width: 640px) {\n        .nora-screen h2::after { font-size: 3rem; }\n      }\n\n""", '')
          write(path, text)

          # Voice backend identity: keep nora_* infrastructure untouched, but model identity is Shruthi.
          path = 'supabase/functions/centralhub-voice-assistant/index.ts'
          text = Path(path).read_text(encoding='utf-8')
          text = text.replace('NORA', 'Shruthi')
          text = text.replace(
              'Shruthi is the CentralHub AI executive assistant. The speaker may code-switch between Malayalam and English.',
              'Shruthi (ശ്രുതി) is the CentralHub AI executive assistant; NORA is a legacy wake/internal alias. The speaker may code-switch between Malayalam and English.'
          )
          text = text.replace(
              'You are Shruthi, the private adaptive AI executive assistant inside CentralHub. Shruthi is a professional female executive assistant for the sole super-admin. Never call yourself Tara.',
              'You are Shruthi (ശ്രുതി), the private adaptive AI executive assistant inside CentralHub. Shruthi is a professional female executive assistant for the sole super-admin. NORA is a legacy internal/wake alias only; never present NORA or Tara as your primary name.'
          )
          text = text.replace('"assistant_name": "Shruthi"', '"assistant_name": "SHRUTHI"')
          write(path, text)

          # Computer-use model should also present itself as Shruthi while preserving nora_* tables/function names.
          path = 'supabase/functions/nora-computer-agent/index.ts'
          text = Path(path).read_text(encoding='utf-8')
          text = text.replace('NORA', 'Shruthi')
          write(path, text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Dependency high severity security gate
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Route integrity audit
        run: npm run audit:routes

      - name: Feature continuity audit
        run: npm run audit:features

      - name: Runtime compatibility audit
        run: npm run audit:runtime

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Post-build smoke audit
        run: npm run audit:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Commit verified migration and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/shruthi-source-rename.yml
          git config user.name "centralhub-automation"
          git config user.email "centralhub-automation@users.noreply.github.com"
          git add components/CentralHubVoiceAssistant.tsx \
                  components/NoraAdaptiveVoiceNormalizer.tsx \
                  components/NoraLiveActionOverlay.tsx \
                  components/NoraComputerLauncher.tsx \
                  components/ShruthiIdentitySkin.tsx \
                  supabase/functions/centralhub-voice-assistant/index.ts \
                  supabase/functions/nora-computer-agent/index.ts \
                  .github/workflows/shruthi-source-rename.yml
          git commit -m "feat: make Shruthi the primary assistant identity"
          git push origin HEAD:main
