name: One-off Shruthi computer agent config fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shruthi-computer-env.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore legacy internal model environment key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/nora-computer-agent/index.ts')
          s = p.read_text(encoding='utf-8')
          old = 'Deno.env.get("Shruthi_COMPUTER_MODEL")'
          new = 'Deno.env.get("NORA_COMPUTER_MODEL")'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one {old}, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Dependency high severity security gate
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Runtime compatibility audit
        run: npm run audit:runtime

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Post-build smoke audit
        run: npm run audit:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Commit verified fix and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-shruthi-computer-env.yml
          git config user.name "centralhub-automation"
          git config user.email "centralhub-automation@users.noreply.github.com"
          git add supabase/functions/nora-computer-agent/index.ts .github/workflows/fix-shruthi-computer-env.yml
          git commit -m "fix: preserve NORA computer model env compatibility"
          git push origin HEAD:main
