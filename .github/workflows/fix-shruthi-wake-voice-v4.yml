name: One-off Shruthi wake and voice safety fix v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shruthi-wake-voice-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Apply explicit Shruthi wake and female-voice-only patch
        shell: bash
        run: |
          echo '' | xxd -r -p | gzip -d > /tmp/fix_shruthi.py
          python3 /tmp/fix_shruthi.py

      - name: Install dependencies
        run: npm ci

      - name: Dependency high severity security gate
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Runtime compatibility audit
        run: npm run audit:runtime

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Post-build smoke audit
        run: npm run audit:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://icnvrpnzjjcbvgcqgiua.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Commit verified fix and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-shruthi-wake-voice-v4.yml
          git config user.name "centralhub-automation"
          git config user.email "centralhub-automation@users.noreply.github.com"
          git add android/app/src/main/java/com/centralhub/network/MainActivity.java \
                  android/app/src/main/java/com/centralhub/network/CentralHubNativeBridge.java \
                  components/CentralHubVoiceAssistant.tsx \
                  .github/workflows/fix-shruthi-wake-voice-v4.yml
          git commit -m "fix: require explicit Shruthi wake and block male TTS fallback"
          git push origin HEAD:main
