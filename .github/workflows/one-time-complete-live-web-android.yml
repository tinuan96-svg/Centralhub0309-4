name: Complete Live Web Android

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-complete-live-web-android.yml'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply native Live Web patch
        run: python3 scripts/complete_live_web_android.py

      - name: Verify web application
        run: |
          npm ci
          npm audit --audit-level=high
          npx tsc --noEmit
          npm run build

      - name: Verify Android browser
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Commit verified implementation
        run: |
          rm -f scripts/complete_live_web_android.py .github/workflows/one-time-complete-live-web-android.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete CentralHub Live Web native browser"
          git push origin HEAD:main
