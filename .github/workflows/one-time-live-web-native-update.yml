name: One-time Live Web and native updater

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-live-web-native-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply Live Web and native updater patch
        run: python3 scripts/one_time_live_web_patch.py

      - name: Normalize generated client directive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/live-web/page.tsx')
          s = p.read_text()
          if s.startswith("\\'use client\\';"):
              s = s.replace("\\'use client\\';", "'use client';", 1)
          p.write_text(s)
          PY

      - name: Verify web and Android changes
        run: |
          npm ci
          npx eslint app/live-web/page.tsx app/dashboard/components/AppUpdateStatus.tsx components/Sidebar.tsx
          npx tsc --noEmit
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/one-time-live-web-native-update.yml scripts/one_time_live_web_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add CentralHub Live Web and in-app Android updater"
          git push origin HEAD:main
