# Supabase configuration file
project_id = "icnvrpnzjjcbvgcqgiua"

[functions.whatsapp-webhook]
verify_jwt = false

# whatsapp-send performs its own Supabase auth check so browser calls can reach
# the function and receive a useful 401/403 instead of being rejected by the
# Edge gateway before the function can validate the session.
[functions.whatsapp-send]
verify_jwt = false

[functions.whatsapp-retry-worker]
verify_jwt = false

[functions.competitor-price-scanner]
verify_jwt = false

# Custom-auth supervisor: validates admin/service-role access or the existing
# competitor cron secret. It writes dry-run reviews only; price execution remains
# behind Pricing Approval Centre.
[functions.competitor-intelligence-agent]
verify_jwt = false

[functions.whatsapp-media]
verify_jwt = false

[functions.setup-admin]
verify_jwt = true

[functions.create-user]
verify_jwt = true

[functions.update-order-status]
verify_jwt = true

[functions.dhl-ecommerce]
verify_jwt = true

# Custom-auth internal function. It validates the existing Site Health worker
# secret and only allows whitelisted Netlify site IDs.
[functions.netlify-build-trigger]
verify_jwt = false
